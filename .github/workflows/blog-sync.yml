name: 블로그 행사 자동 반영

on:
  schedule:
    - cron: "0 22 * * *" # 매일 오전 7시 (한국 시간)
  workflow_dispatch: {} # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 준비
        run: pip install pillow pydantic

      - name: 네이버 블로그 새 글 분석 후 행사 데이터 갱신
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -u scripts/sync_blog.py

      - name: 바뀐 내용 저장
        run: |
          git config user.name "badabook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.js data/blog-state.json images/events
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "블로그 행사 자동 반영 ($(TZ=Asia/Seoul date +%F))"
            git push
            # 봇이 올린 변경도 홈페이지에 바로 반영되도록 다시 배포 요청
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
