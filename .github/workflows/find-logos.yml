name: 출판사 로고 찾기 (일회용)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/find_logos.py
      - run: |
          git config user.name badabook-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b logo-candidates
          git add -f out
          git commit -m "로고 후보" || exit 0
          git push -f origin logo-candidates
